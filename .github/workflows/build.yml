name: Release
on:
    push:
        branches:
            - main
            - master
    workflow_dispatch:

env:
    FORCE_COLOR: true
    GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    REPO: domdoesntdodrip/dimcord
    USERNAME: GitHub-Actions

permissions:
    contents: write

jobs:
    Build:
        name: Build Dimcord
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Setup PNPM
              uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
              with:
                  runtime: node@v24
                  require-lockfile: true

            - name: Build web
              run: pnpm buildWebStandalone

            - name: Build
              run: pnpm buildStandalone

            - name: Generate plugin lists
              run: |
                  pnpm generatePluginJson dist/plugins.json
                  pnpm generateEquicordPluginJson dist/equicordplugins.json
                  pnpm generateVencordPluginJson dist/vencordplugins.json
                  pnpm generateDevsList dist/devs.json

            - name: Collect files to be released
              run: |
                  cd dist
                  mkdir -p release

                  cp browser/browser.* release/ 2>/dev/null || true
                  cp Equicord.user.{js,js.LEGAL.txt} release/ 2>/dev/null || true

                  # copy the plugin data jsons, the extension zips and the desktop/equibop asars
                  cp *.{json,zip,asar} release/ 2>/dev/null || true

                  # create desktop.zip and payload.zip for installers
                  (cd desktop && zip -r ../release/desktop.zip .)
                  cp release/desktop.zip release/payload.zip

                  # legacy un-asared files
                  cp desktop/* release/ 2>/dev/null || true
                  for file in equibop/*; do
                    [ -f "$file" ] || continue
                    filename=$(basename "$file")
                    cp "$file" "release/equibop${filename^}"
                  done

                  find release -size 0 -delete
                  rm -f release/package.json
                  rm -f release/*.map

            - name: Upload Dimcord Stable
              if: ${{ vars.ACT == 'false' }}
              run: |
                  gh release upload latest --clobber dist/release/* || gh release create latest --title "Dimcord Latest" --notes "Latest automated build of Dimcord" dist/release/* || gh release upload prereleasev1 --clobber dist/release/* || true
